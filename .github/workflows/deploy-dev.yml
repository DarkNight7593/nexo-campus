name: Deploy dev
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency: deploy-dev
jobs:
  deploy:
    environment: dev
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Verify AWS deployment configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: test -n "$AWS_DEPLOY_ROLE_ARN" || (echo "Configure AWS_DEPLOY_ROLE_ARN in the dev GitHub Environment before deploying." && exit 1)
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - run: npm run deploy:dev
