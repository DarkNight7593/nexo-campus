openapi: 3.0.3
info:
  title: Nexo Campus - Courses API
  version: 1.0.0
  description: CRUD de cursos en DynamoDB y búsqueda de lectura en OpenSearch.
servers:
  - url: https://{apiId}.execute-api.{region}.amazonaws.com/{stage}
    variables:
      apiId: { default: example, description: API ID entregado por CloudFormation }
      region: { default: us-east-1 }
      stage: { default: dev }
security:
  - CognitoIdToken: []
tags:
  - name: Courses
  - name: Search
paths:
  /courses:
    post:
      tags: [Courses]
      operationId: createCourse
      summary: Crea un curso en el tenant autenticado
      description: Requiere `admin` o `instructor`; el instructor sólo puede usar su propio `sub` como `instructorId`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourseInput' }
            examples:
              course:
                externalValue: ./examples/create-course.request.json
      responses:
        '201':
          description: Curso creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Course' }
              examples:
                created:
                  externalValue: ./examples/course.response.json
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Courses]
      operationId: listCourses
      summary: Lista cursos del tenant desde DynamoDB
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: nextToken
          in: query
          description: Token opaco devuelto por la página anterior.
          schema: { type: string }
      responses:
        '200':
          description: Página de cursos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoursePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /courses/{courseId}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [Courses]
      operationId: getCourse
      summary: Obtiene un curso del tenant autenticado
      responses:
        '200':
          description: Curso encontrado
          content: { application/json: { schema: { $ref: '#/components/schemas/Course' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Courses]
      operationId: updateCourse
      summary: Actualiza campos de un curso
      description: Requiere `admin` o el instructor propietario. Un instructor no puede reasignar el curso a otro usuario. Si se modifican fechas deben conservar `endDate >= startDate`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCourse' }
      responses:
        '200':
          description: Curso actualizado
          content: { application/json: { schema: { $ref: '#/components/schemas/Course' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Courses]
      operationId: deleteCourse
      summary: Elimina un curso
      description: Requiere `admin` o el instructor propietario.
      responses:
        '204': { description: Curso eliminado }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /search:
    get:
      tags: [Search]
      operationId: searchCourses
      summary: Busca cursos del tenant en OpenSearch
      description: Índice derivado con consistencia eventual respecto de DynamoDB.
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 }, description: Texto en nombre y descripción }
        - { name: minPrice, in: query, schema: { type: number, minimum: 0 } }
        - { name: maxPrice, in: query, schema: { type: number, minimum: 0 } }
        - { name: startDate, in: query, schema: { type: string, format: date } }
        - { name: endDate, in: query, schema: { type: string, format: date } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: from, in: query, schema: { type: integer, minimum: 0, maximum: 9999, default: 0 }, description: "from + pageSize no puede superar 10000." }
      responses:
        '200':
          description: Resultados de búsqueda
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResult' }
              examples:
                result:
                  externalValue: ./examples/search.response.json
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  securitySchemes:
    CognitoIdToken: { type: apiKey, in: header, name: Authorization, description: ID token JWT sin prefijo emitido por Cognito }
  parameters:
    CourseId:
      name: courseId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
  schemas:
    CourseInput:
      type: object
      additionalProperties: false
      required: [instructorId, name, description, startDate, endDate, price]
      properties:
        instructorId: { type: string, minLength: 1, maxLength: 128 }
        name: { type: string, minLength: 2, maxLength: 160 }
        description: { type: string, minLength: 2, maxLength: 4000 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, description: Debe ser igual o posterior a startDate }
        price: { type: number, minimum: 0 }
    UpdateCourse:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        instructorId: { type: string, minLength: 1, maxLength: 128 }
        name: { type: string, minLength: 2, maxLength: 160 }
        description: { type: string, minLength: 2, maxLength: 4000 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        price: { type: number, minimum: 0 }
    Course:
      allOf:
        - $ref: '#/components/schemas/CourseInput'
        - type: object
          required: [tenantId, courseId, createdAt, updatedAt]
          properties:
            tenantId: { type: string }
            courseId: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    ScheduleSummary:
      type: object
      additionalProperties: true
      properties:
        tenantId: { type: string }
        courseId: { type: string }
        scheduleId: { type: string }
        days: { type: array, items: { type: string } }
        startTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        endTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
    CoursePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Course' } }
        nextToken: { type: string }
    SearchCourse:
      allOf:
        - $ref: '#/components/schemas/Course'
        - type: object
          required: [schedules]
          properties:
            schedules: { type: array, items: { $ref: '#/components/schemas/ScheduleSummary' } }
    SearchResult:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SearchCourse' } }
        total: { type: integer, minimum: 0 }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        issues: { type: array, items: { type: object, additionalProperties: true } }
  responses:
    BadRequest: { description: JSON o parámetros inválidos, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized: { description: Token ausente, inválido o incompleto, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: Rol o propiedad del curso insuficiente, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Curso no encontrado, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: El curso ya existe, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    InternalError: { description: Error interno, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
